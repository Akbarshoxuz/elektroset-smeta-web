<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elektroset Smeta</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #f0f2f5);
      color: var(--tg-theme-text-color, #333);
      padding: 0;
      padding-bottom: 80px;
      overflow-x: hidden;
      max-width: 100vw;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0D47A1, #1976D2);
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(13,71,161,0.25);
    }
    .header-logo {
      height: 44px;
      background: white;
      border-radius: 10px;
      padding: 4px;
    }
    .header h1 {
      font-size: 20px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header-sub {
      font-size: 12px;
      color: #90CAF9;
      margin-top: 2px;
      font-weight: 400;
    }

    /* Content wrapper */
    .content-wrap { padding: 0 12px; }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    .back-btn {
      background: none; border: none; color: #1565C0; font-size: 14px;
      font-weight: 600; cursor: pointer; padding: 8px 0; margin-bottom: 8px;
    }
    .back-btn:active { opacity: 0.6; }

    /* Steps bar */
    .steps-bar {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f2f5);
      border-radius: 10px; padding: 4px;
    }
    .steps-bar .step {
      flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
      font-size: 12px; font-weight: 600; color: #999;
      transition: all 0.25s;
    }
    .steps-bar .step.active {
      background: linear-gradient(135deg, #1565C0, #1976D2);
      color: white;
      box-shadow: 0 2px 8px rgba(21,101,192,0.3);
    }
    .steps-bar .step.done { color: #2e7d32; }

    .step-content { display: none; }
    .step-content.active { display: block; }

    /* Home screen buttons */
    .home-actions { display: flex; gap: 10px; margin-top: 20px; }
    .home-btn {
      flex: 1; padding: 20px 16px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: all 0.25s; text-align: center;
    }
    .home-btn:active { transform: scale(0.96); }
    .home-btn-new {
      background: linear-gradient(135deg, #43A047, #66BB6A);
      color: white; box-shadow: 0 4px 12px rgba(67,160,71,0.3);
    }
    .home-btn-list {
      background: linear-gradient(135deg, #1565C0, #1976D2);
      color: white; box-shadow: 0 4px 12px rgba(21,101,192,0.3);
    }
    .home-admin-btn {
      display: none; margin-top: 12px; padding: 10px 16px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
      background: linear-gradient(135deg, #E65100, #FF6F00); color: white;
      box-shadow: 0 2px 8px rgba(230,81,0,0.3);
      transition: all 0.25s;
    }
    .home-admin-btn:active { transform: scale(0.98); }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: var(--tg-theme-text-color, #444); }
    input, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid #dde1e7; border-radius: 10px;
      font-size: 14px; background: var(--tg-theme-secondary-bg-color, white);
      color: var(--tg-theme-text-color, #333);
      transition: all 0.25s ease;
    }
    input:focus, select:focus {
      border-color: var(--tg-theme-button-color, #1976D2);
      outline: none;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
    }

    /* Cards */
    .card {
      background: var(--tg-theme-secondary-bg-color, white);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    /* Material list items */
    .mat-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px; background: var(--tg-theme-secondary-bg-color, white);
      border-radius: 10px; margin-bottom: 8px;
      border-left: 4px solid #1976D2;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      transition: all 0.25s ease;
    }
    .mat-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }
    .mat-item.service { border-left-color: #e65100; }
    .mat-item.service[style*="border-left-color: rgb(46, 125, 50)"],
    .mat-item.service[style*="border-left-color:#2E7D32"] {
      border-left-color: #2E7D32 !important;
    }
    .mat-item.inactive {
      opacity: 0.5; border-left-color: #999;
    }
    .mat-item.inactive .name {
      text-decoration: line-through;
    }
    .mat-item .name { font-weight: 600; font-size: 13px; flex: 1; }
    .mat-item .info { font-size: 12px; color: #888; }
    .mat-item .sum { font-weight: 700; font-size: 14px; color: var(--tg-theme-button-color, #1565C0); }
    .mat-item .actions { display: flex; gap: 6px; margin-left: 8px; }
    .mat-item .actions button {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer;
      transition: all 0.25s ease;
    }
    .mat-item .actions button:hover {
      transform: scale(1.1);
    }
    .btn-toggle { background: #e8f5e9; color: #2E7D32; }
    .mat-item.inactive .btn-toggle { background: #ffebee; color: #c62828; }
    .btn-delete { background: #ffebee; color: #c62828; }
    .btn-delete:hover { background: #ffcdd2; }
    .qty-edit {
      color: #1565C0; text-decoration: underline; cursor: pointer;
      padding: 2px 6px; border-radius: 4px;
      transition: all 0.2s;
    }
    .qty-edit:hover { background: #e3f2fd; }
    .qty-edit:active { background: #bbdefb; }

    /* Summary */
    .summary { margin-top: 16px; }
    .summary-row {
      display: flex; justify-content: space-between; padding: 8px 0;
      font-size: 14px; border-bottom: 1px solid #eee;
    }
    .summary-row.total { font-weight: 700; font-size: 16px; border-bottom: 2px solid; }

    /* Buttons */
    .btn {
      padding: 12px 20px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
      margin-top: 8px; transition: all 0.25s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #1565C0, #1976D2);
      color: var(--tg-theme-button-text-color, white);
      box-shadow: 0 2px 8px rgba(21,101,192,0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 16px rgba(21,101,192,0.4);
    }
    .btn-add {
      background: linear-gradient(135deg, #43A047, #66BB6A);
      color: white;
      box-shadow: 0 2px 8px rgba(67,160,71,0.3);
    }
    .btn-add:hover {
      box-shadow: 0 4px 16px rgba(67,160,71,0.4);
    }
    .btn-outline {
      background: transparent; border: 2px solid var(--tg-theme-button-color, #1976D2);
      color: var(--tg-theme-button-color, #1976D2);
      border-radius: 10px;
    }
    .btn-outline:hover {
      background: rgba(21,101,192,0.06);
    }

    .linked-preview {
      font-size: 12px; color: #666; margin-top: 8px; padding: 10px 12px;
      background: #f5f7fa; border-radius: 8px; border-left: 3px solid #1976D2;
    }
    .linked-preview b { color: #333; }

    .empty-msg { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

    .loading { text-align: center; padding: 40px; color: #999; }

    /* Status message with slide-in animation */
    @keyframes slideInDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .status-msg {
      padding: 12px 16px; border-radius: 10px; margin: 0 12px 12px;
      font-size: 13px; text-align: center; display: none;
      font-weight: 500;
    }
    .status-msg.success {
      display: block; background: #e8f5e9; color: #2e7d32;
      border: 1px solid #c8e6c9;
      animation: slideInDown 0.3s ease;
    }
    .status-msg.error {
      display: block; background: #ffebee; color: #c62828;
      border: 1px solid #ffcdd2;
      animation: slideInDown 0.3s ease;
    }

    /* Smeta search */
    .smeta-search { position: relative; margin-bottom: 10px; }
    .smeta-search input {
      width: 100%; padding: 9px 12px 9px 34px; border: 1.5px solid #ddd;
      border-radius: 10px; font-size: 13px;
      background: var(--tg-theme-secondary-bg-color, white);
      color: var(--tg-theme-text-color, #333);
    }
    .smeta-search input:focus { border-color: #1565C0; outline: none; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
    .smeta-search::before {
      content: '\1F50D'; position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); font-size: 14px; opacity: 0.4;
    }
    .smeta-count { font-size: 11px; color: #999; text-align: right; margin-bottom: 6px; }

    /* Smeta list — compact */
    .smeta-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: var(--tg-theme-secondary-bg-color, white);
      border-radius: 10px; margin-bottom: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: transform 0.15s;
    }
    .smeta-row:active { transform: scale(0.98); }
    .smeta-num { font-size: 11px; color: #999; font-weight: 700; min-width: 18px; text-align: center; }
    .smeta-info { flex: 1; min-width: 0; overflow: hidden; }
    .smeta-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .smeta-meta { font-size: 10px; color: #999; }
    .smeta-acts { display: flex; gap: 4px; flex-shrink: 0; }
    .smeta-acts button {
      padding: 6px 8px; border: none; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .smeta-acts button:active { transform: scale(0.9); }
    .btn-pdf { background: #e3f2fd; color: #1565c0; }
    .btn-xlsx { background: #e8f5e9; color: #2e7d32; }
    .btn-del { background: #ffebee; color: #c62828; }

    /* Admin panel */
    .adm-section {
      margin-bottom: 8px; border-radius: 12px; overflow: hidden;
      background: var(--tg-theme-secondary-bg-color, white);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .adm-summary {
      padding: 14px 16px; font-weight: 700; font-size: 15px; cursor: pointer;
      list-style: none; display: flex; align-items: center; gap: 10px;
      transition: background 0.2s;
    }
    .adm-summary:hover { background: rgba(0,0,0,0.03); }
    .adm-summary::-webkit-details-marker { display: none; }
    .adm-summary::after {
      content: '\25B8'; margin-left: auto;
      transition: transform 0.3s ease; font-size: 12px; color: #888;
    }
    details[open] > .adm-summary::after { transform: rotate(90deg); }
    details[open] > .adm-summary { border-bottom: 1px solid #eee; }
    .adm-body {
      padding: 12px 12px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .adm-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 12px; background: var(--tg-theme-bg-color, #f5f7fa);
      border-radius: 10px; margin-bottom: 6px; font-size: 13px;
      transition: all 0.2s;
    }
    .adm-item:hover { background: #eef1f5; }
    .adm-item .ai-name { font-weight: 600; }
    .adm-item .ai-info { color: #888; font-size: 12px; }
    .adm-item .ai-acts { display: flex; gap: 5px; margin-left: 8px; flex-shrink: 0; }
    .adm-item .ai-acts button {
      padding: 5px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .adm-item .ai-acts button:hover { transform: scale(1.05); }
    .ai-edit { background: #e3f2fd; color: #1565c0; }
    .ai-del { background: #ffebee; color: #c62828; }
    .adm-link-item { flex-direction: column; align-items: stretch; }
    .adm-link-top { display: flex; justify-content: space-between; align-items: center; }
    .adm-link-children { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.7; }
    .adm-link-children b { color: #333; }
    .al-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .al-row select {
      flex: 1; padding: 9px; font-size: 13px; border: 1.5px solid #dde1e7;
      border-radius: 8px; background: var(--tg-theme-secondary-bg-color, white);
      color: var(--tg-theme-text-color, #333);
    }
    .al-row input {
      width: 60px; padding: 9px; font-size: 13px; border: 1.5px solid #dde1e7; border-radius: 8px;
    }
    .al-row-rm {
      width: 30px; height: 30px; border: none; background: #ffebee; color: #c62828;
      border-radius: 8px; cursor: pointer; font-size: 14px; flex-shrink: 0;
      transition: all 0.2s;
    }
    .al-row-rm:hover { background: #ffcdd2; }
    /* Nav step buttons row */
    .step-nav { display: flex; gap: 8px; margin-top: 16px; }
    .step-nav .btn { flex: 1; }

    /* Print preview */
    .print-doc {
      background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1); font-size: 11px; color: #222;
      overflow-x: auto;
    }
    .print-doc .pd-title {
      text-align: center; font-weight: 700; font-size: 13px; margin-bottom: 4px;
      line-height: 1.4; color: #0D47A1;
    }
    .print-doc .pd-no { text-align: center; font-size: 11px; margin-bottom: 10px; color: #555; }
    .print-doc table {
      width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 10px;
    }
    .print-doc th, .print-doc td {
      border: 1px solid #bbb; padding: 4px 5px; text-align: center;
    }
    .print-doc th {
      background: linear-gradient(135deg, #1565C0, #1976D2);
      color: white; font-size: 9px; font-weight: 600;
    }
    .print-doc .tr-total td { background: #BBDEFB; font-weight: 700; }
    .print-doc td.al { text-align: left; }
    .print-doc td.ar { text-align: right; }
    .print-doc .inactive-row td { color: #999; text-decoration: line-through; }
    .print-doc .ct-jami td { background: #FFF9C4; font-weight: 700; }
    .print-doc .ct-total td { background: #FFCC02; font-weight: 700; font-size: 12px; }
    .print-doc .pd-izoh {
      font-size: 9px; color: #555; margin-top: 10px; line-height: 1.4;
      padding: 8px; background: #f9f9f9; border-radius: 6px;
    }
    .print-doc .pd-izoh b { color: #333; }

    /* Loading overlay */
    .overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 9999;
      justify-content: center; align-items: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .overlay.active { display: flex; }
    .overlay-box {
      background: var(--tg-theme-bg-color, white); border-radius: 18px;
      padding: 30px 40px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25); min-width: 200px;
    }
    .overlay-spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0;
      border-top-color: var(--tg-theme-button-color, #1976D2);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
      /* Exclude spinner from global transition */
      transition: none !important;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-text { font-size: 14px; font-weight: 600; color: var(--tg-theme-text-color, #333); }

    /* Details/Xizmat qo'shish panel */
    details > summary {
      transition: all 0.2s;
    }
    details > summary:hover {
      opacity: 0.85;
    }

    /* Textarea in admin */
    textarea {
      transition: all 0.25s ease;
    }
    textarea:focus {
      border-color: var(--tg-theme-button-color, #1976D2);
      outline: none;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
    }
  </style>
</head>
<body>
  <!-- Loading overlay -->
  <div id="loadingOverlay" class="overlay">
    <div class="overlay-box">
      <div class="overlay-spinner"></div>
      <div class="overlay-text" id="loadingText">Yuklanmoqda...</div>
    </div>
  </div>

  <div class="header">
    <img src="logo.png" alt="Logo" class="header-logo">
    <div>
      <h1>Elektroset Smeta</h1>
      <div class="header-sub">Sarf harajat smetasi tizimi</div>
    </div>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <div class="content-wrap">

  <!-- ========== SCREEN: HOME ========== -->
  <div id="screen-home" class="screen active">
    <div class="home-actions">
      <button class="home-btn home-btn-new" onclick="goScreen('new')">+ Yangi</button>
      <button class="home-btn home-btn-list" onclick="goScreen('smetas')">Smetalar</button>
    </div>
    <button class="home-admin-btn" id="adminBtn" onclick="goScreen('admin')">Admin panel</button>
  </div>

  <!-- ========== SCREEN: SMETALAR ========== -->
  <div id="screen-smetas" class="screen">
    <button class="back-btn" onclick="goScreen('home')">&larr; Ortga</button>
    <div class="smeta-search" id="smetaSearchWrap" style="display:none;">
      <input type="text" id="smetaSearch" placeholder="Qidirish..." oninput="filterSmetas()">
    </div>
    <div id="smetaCount" class="smeta-count" style="display:none;"></div>
    <div id="smetaList"></div>
  </div>

  <!-- ========== SCREEN: YANGI SMETA (3-step wizard) ========== -->
  <div id="screen-new" class="screen">
    <button class="back-btn" onclick="goStepBack()">&larr; Ortga</button>
    <div class="steps-bar">
      <span class="step active" data-step="1">&#9312; Ma'lumotlar</span>
      <span class="step" data-step="2">&#9313; Material</span>
      <span class="step" data-step="3">&#9314; Hisob</span>
    </div>

    <!-- Step 1: Buyer info -->
    <div id="step-1" class="step-content active">
      <div class="card">
        <div class="form-group">
          <label>Viloyat:</label>
          <select id="viloyat">
            <option value="">— Tanlang —</option>
            <option>Andijon viloyati</option>
            <option>Buxoro viloyati</option>
            <option>Farg'ona viloyati</option>
            <option>Jizzax viloyati</option>
            <option>Namangan viloyati</option>
            <option>Navoiy viloyati</option>
            <option>Qashqadaryo viloyati</option>
            <option>Qoraqalpog'iston Respublikasi</option>
            <option>Samarqand viloyati</option>
            <option>Sirdaryo viloyati</option>
            <option>Surxondaryo viloyati</option>
            <option>Toshkent shahri</option>
            <option>Toshkent viloyati</option>
            <option>Xorazm viloyati</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tuman:</label>
          <input type="text" id="tuman" placeholder="Oltinko'l tumani">
        </div>
        <div class="form-group">
          <label>MFY:</label>
          <input type="text" id="mfy" placeholder="Dalvarzin MFY">
        </div>
        <div class="form-group">
          <label>Ko'cha / Manzil:</label>
          <input type="text" id="kocha" placeholder="Farovon ko'cha 19-uy">
        </div>
        <div class="form-group">
          <label>Korxona / Buyurtmachi:</label>
          <input type="text" id="korxona" placeholder="Korxona nomi">
        </div>
        <div class="form-group">
          <label>Smeta raqami:</label>
          <input type="text" id="smetaNo" placeholder="168466">
        </div>
      </div>
      <button class="btn btn-primary" onclick="goStep(2)">Keyingi &rarr;</button>
    </div>

    <!-- Step 2: Materials -->
    <div id="step-2" class="step-content">
      <!-- Material qo'shish -->
      <div class="card">
        <div class="form-group">
          <label>Material oilasi:</label>
          <select id="familySelect" onchange="onFamilyChange()">
            <option value="">-- Tanlang --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Material:</label>
          <select id="materialSelect" onchange="onMaterialChange()">
            <option value="">-- Avval oilani tanlang --</option>
          </select>
        </div>
        <div id="materialInfo" style="display:none">
          <div style="font-size:13px;color:#666;margin-bottom:6px;">
            O'lchov: <b id="matUnit"></b> | Narx: <b id="matPrice"></b> so'm
          </div>
          <div class="form-group">
            <label>Miqdor:</label>
            <input type="number" id="matQty" value="1" min="0.1" step="0.1">
          </div>
          <div id="linkedPreview" class="linked-preview" style="display:none"></div>
          <button class="btn btn-add" onclick="addMaterial()">Qo'shish</button>
        </div>
      </div>

      <!-- Xizmat qo'shish -->
      <details style="margin-bottom: 10px;">

  <script>
    // ==================== DATA ====================
    var appData = {
      families: {},
      services: [],
      settings: { loyihaPercent: 5, qqsPercent: 12, korxonaPercent: 18.71 },
      materials: [],    // qo'shilgan materiallar
      svcItems: [],     // qo'shilgan xizmatlar
      telegramId: null
    };

    // ==================== GAS API ====================
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbwF5EvkZTQRd_GwZGvJiPdTjgNlqVmktvrqRKufgkErdKwHzemxuWi8woPul8RXsmvohA/exec';

    function gasGet(action, params) {
      var url = GAS_URL + '?action=' + encodeURIComponent(action);
      if (params) {
        for (var key in params) {
          if (params.hasOwnProperty(key) && params[key] !== undefined && params[key] !== null) {
            url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
          }
        }
      }
      return fetch(url).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    function gasPost(action, data) {
      var payload = Object.assign({ action: action }, data);
      return fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        redirect: 'follow'
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    // ==================== INIT ====================
    var currentStep = 1;

    window.onload = function() {
      // Telegram Web App
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        var user = Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
        if (user) {
          appData.telegramId = user.id;
        }
      }

      // URL parametr orqali telegramId olish
      var urlParams = new URLSearchParams(window.location.search);
      var urlTgId = urlParams.get('tgid');
      if (urlTgId && !appData.telegramId) {
        appData.telegramId = urlTgId;
      }

      // Load data silently in background (no overlay)
      loadData();
    };

    function loadData(onDone) {
      gasGet('getFullData', { tgid: appData.telegramId || 0 })
        .then(function(data) {
          if (data.error) { showStatus(data.error, 'error'); if (onDone) onDone(); return; }
          if (data.families) appData.families = data.families;
          if (data.services) appData.services = data.services;
          if (data.settings) appData.settings = data.settings;
          populateFamilies();
          populateServices();
          if (data.user && data.user.role === 'admin') {
            document.getElementById('adminBtn').style.display = 'block';
          }
          if (onDone) onDone();
        })
        .catch(function(err) {
          showStatus('Xatolik: ' + err.message, 'error');
          if (onDone) onDone();
        });
    }

    // ==================== NAVIGATION ====================
    function goScreen(name) {
      // Hide all screens
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');

      // Show target screen
      var target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');

      // Screen-specific actions
      if (name === 'smetas') {
        showLoading('Smetalar yuklanmoqda...');
        loadSmetaList(function() { hideLoading(); });
      }
      if (name === 'new') {
        currentStep = 1;
        updateStepUI();
      }

      // Scroll to top
      window.scrollTo(0, 0);
    }

    function goStep(n) {
      // Validate before going forward
      if (n === 2 && currentStep === 1) {
        // No strict validation needed here, but could add
      }
      if (n === 3) {
        renderSummary();
      }

      currentStep = n;
      updateStepUI();
      window.scrollTo(0, 0);
    }

    function goStepBack() {
      if (currentStep > 1) {
        goStep(currentStep - 1);
      } else {
        goScreen('home');
      }
    }

    function updateStepUI() {
      // Update step indicators
      var steps = document.querySelectorAll('.steps-bar .step');
      for (var i = 0; i < steps.length; i++) {
        var stepNum = parseInt(steps[i].getAttribute('data-step'));
        steps[i].classList.remove('active', 'done');
        if (stepNum === currentStep) {
          steps[i].classList.add('active');
        } else if (stepNum < currentStep) {
          steps[i].classList.add('done');
        }
      }

      // Update step content
      var contents = document.querySelectorAll('.step-content');
      for (var j = 0; j < contents.length; j++) contents[j].classList.remove('active');
      var target = document.getElementById('step-' + currentStep);
      if (target) target.classList.add('active');
    }

    // ==================== SMETA LIST ====================
    function loadSmetaList(onDone) {
      gasGet('getSmetaList', { tgid: appData.telegramId || 0 })
        .then(function(list) {
          renderSmetaList(list);
          if (onDone) onDone();
        })
        .catch(function(err) {
          document.getElementById('smetaList').innerHTML =
            '<div class="empty-msg">Xatolik: ' + err.message + '</div>';
          if (onDone) onDone();
        });
    }

    var allSmetas = [];

    function renderSmetaList(list) {
      var el = document.getElementById('smetaList');
      var searchWrap = document.getElementById('smetaSearchWrap');
      var countEl = document.getElementById('smetaCount');

      if (!list || list.error || (Array.isArray(list) && list.length === 0)) {
        searchWrap.style.display = 'none';
        countEl.style.display = 'none';
        el.innerHTML = '<div class="empty-msg">Hech qanday smeta topilmadi.<br><br>' +
          '<button class="btn btn-primary" style="width:auto;display:inline-block;padding:10px 24px;" ' +
          'onclick="goScreen(\'new\')">Yangi smeta yaratish</button></div>';
        return;
      }

      list.sort(function(a, b) { return String(b.id).localeCompare(String(a.id)); });
      allSmetas = list;
      searchWrap.style.display = 'block';
      renderFilteredSmetas(list);
    }

    function renderFilteredSmetas(list) {
      var el = document.getElementById('smetaList');
      var countEl = document.getElementById('smetaCount');
      countEl.textContent = 'Jami: ' + list.length + ' ta smeta';
      countEl.style.display = 'block';

      if (list.length === 0) {
        el.innerHTML = '<div class="empty-msg" style="padding:20px 0;">Topilmadi</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var korxona = s.korxona || 'Noma\'lum';
        var safeSheet = s.sheetName.replace(/'/g, "\\'");
        var safeKorxona = korxona.replace(/'/g, "\\'");
        var loc = s.location ? ' · ' + escHtml(s.location) : '';

        html += '<div class="smeta-row">';
        html += '<span class="smeta-num">' + (i + 1) + '</span>';
        html += '<div class="smeta-info">';
        html += '<div class="smeta-name">' + escHtml(korxona) + '</div>';
        html += '<div class="smeta-meta">#' + s.id + ' · ' + s.date + loc + ' · ' + fmtNum(s.summa || 0) + ' so\'m</div>';
        html += '</div>';
        html += '<div class="smeta-acts">';
        html += '<button class="btn-pdf" onclick="exportSmeta(\'' + safeSheet + '\',\'pdf\')">PDF</button>';
        html += '<button class="btn-xlsx" onclick="exportSmeta(\'' + safeSheet + '\',\'xlsx\')">XLS</button>';
        html += '<button class="btn-del" onclick="deleteSmeta(\'' + safeSheet + '\',\'' + safeKorxona + '\')">✕</button>';
        html += '</div>';
        html += '</div>';
      }
      el.innerHTML = html;
    }

    function filterSmetas() {
      var q = document.getElementById('smetaSearch').value.toLowerCase().trim();
      if (!q) { renderFilteredSmetas(allSmetas); return; }
      var filtered = allSmetas.filter(function(s) {
        return (s.korxona || '').toLowerCase().indexOf(q) !== -1 ||
               (s.location || '').toLowerCase().indexOf(q) !== -1 ||
               String(s.id || '').toLowerCase().indexOf(q) !== -1 ||
               (s.date || '').toLowerCase().indexOf(q) !== -1;
      });
      renderFilteredSmetas(filtered);
    }

    function exportSmeta(sheetName, format) {
      showLoading(format.toUpperCase() + ' tayyorlanmoqda...');
      gasPost('exportAndSend', { sheetName: sheetName, format: format, telegramId: appData.telegramId })
        .then(function(result) {
          hideLoading();
          if (result.error) { showStatus(result.error, 'error'); return; }
          showStatus(result.fileName + ' Telegramga yuborildi!', 'success');
        })
        .catch(function(err) {
          hideLoading();
          showStatus('Xatolik: ' + err.message, 'error');
        });
    }

    function deleteSmeta(sheetName, korxona) {
      if (!confirm('"' + korxona + '" smetasini o\'chirishni xohlaysizmi?')) return;
      showLoading('O\'chirilmoqda...');
      gasPost('deleteSmetaFromApp', { telegramId: appData.telegramId, sheetName: sheetName })
        .then(function(result) {
          hideLoading();
          if (result.error) { showStatus(result.error, 'error'); return; }
          showStatus('Smeta o\'chirildi!', 'success');
          // Reload list and stay on smetas screen
          showLoading('Smetalar yuklanmoqda...');
          loadSmetaList(function() { hideLoading(); });
        })
        .catch(function(err) {
          hideLoading();
          showStatus('Xatolik: ' + err.message, 'error');
        });
    }

    // ==================== POPULATE ====================
    function populateFamilies() {
      var sel = document.getElementById('familySelect');
      sel.innerHTML = '<option value="">-- Oila tanlang --</option>';
      var keys = Object.keys(appData.families).sort();
      for (var i = 0; i < keys.length; i++) {
        var opt = document.createElement('option');
        opt.value = keys[i];
        opt.textContent = keys[i];
        sel.appendChild(opt);
      }
    }

    function populateServices() {
      var sel = document.getElementById('serviceSelect');
      sel.innerHTML = '<option value="">-- Xizmat tanlang --</option>';
      var groups = {};
      for (var i = 0; i < appData.services.length; i++) {
        var s = appData.services[i];
        var fam = s.family || 'Boshqa';
        if (!groups[fam]) groups[fam] = [];
        groups[fam].push(s);
      }
      var keys = Object.keys(groups).sort();
      for (var k = 0; k < keys.length; k++) {
        var grp = document.createElement('optgroup');
        grp.label = keys[k];
        for (var j = 0; j < groups[keys[k]].length; j++) {
          var s = groups[keys[k]][j];
          var opt = document.createElement('option');
          opt.value = s.name;
          opt.textContent = s.name + ' (' + s.unit + ', ' + fmtNum(s.price) + ')';
          grp.appendChild(opt);
        }
        sel.appendChild(grp);
      }
    }

    function onFamilyChange() {
      var family = document.getElementById('familySelect').value;
      var sel = document.getElementById('materialSelect');
      sel.innerHTML = '<option value="">-- Material tanlang --</option>';
      document.getElementById('materialInfo').style.display = 'none';

      if (!family || !appData.families[family]) return;

      var mats = appData.families[family];
      for (var i = 0; i < mats.length; i++) {
        var opt = document.createElement('option');
        opt.value = mats[i].name;
        opt.textContent = mats[i].name + ' (' + fmtNum(mats[i].price) + ' so\'m)';
        opt.dataset.unit = mats[i].unit;
        opt.dataset.price = mats[i].price;
        sel.appendChild(opt);
      }
    }

    function onMaterialChange() {
      var sel = document.getElementById('materialSelect');
      var opt = sel.options[sel.selectedIndex];

      if (!sel.value) {
        document.getElementById('materialInfo').style.display = 'none';
        return;
      }

      document.getElementById('matUnit').textContent = opt.dataset.unit;
      document.getElementById('matPrice').textContent = fmtNum(opt.dataset.price);
      document.getElementById('materialInfo').style.display = 'block';

      // Before fetching linked items, show a small loading text
      var prev = document.getElementById('linkedPreview');
      prev.innerHTML = '<span style="color:#999">Yuklanmoqda...</span>';
      prev.style.display = 'block';

      // Linked items preview
      gasGet('getLinkedItems', { name: sel.value })
        .then(function(linked) {
          var prev = document.getElementById('linkedPreview');
          if ((!linked.materials || linked.materials.length === 0) &&
              (!linked.services || linked.services.length === 0)) {
            prev.style.display = 'none';
            return;
          }
          var html = '<b>Avtomatik qo\'shiladi:</b><br>';
          for (var i = 0; i < linked.materials.length; i++) {
            html += '+ ' + linked.materials[i].name + ' (' + linked.materials[i].qty + ')<br>';
          }
          for (var j = 0; j < linked.services.length; j++) {
            html += '+ ' + linked.services[j].name + ' (' + linked.services[j].qtyMultiplier + ')<br>';
          }
          prev.innerHTML = html;
          prev.style.display = 'block';
        });
    }

    // ==================== ADD MATERIAL ====================
    // Bir xil material/xizmat bo'lsa soni qo'shiladi, yo'q bo'lsa yangi qator
    function addOrMergeMaterial(name, unit, qty, price, active) {
      for (var i = 0; i < appData.materials.length; i++) {
        if (appData.materials[i].name === name) {
          appData.materials[i].qty += qty;
          return;
        }
      }
      appData.materials.push({ name: name, unit: unit, qty: qty, price: price, active: active });
    }

    function addOrMergeService(name, family, unit, qty, price) {
      for (var i = 0; i < appData.svcItems.length; i++) {
        if (appData.svcItems[i].name === name) {
          appData.svcItems[i].qty += qty;
          return;
        }
      }
      appData.svcItems.push({ name: name, family: family, unit: unit, qty: qty, price: price, active: true });
    }

    function addMaterial() {
      var matName = document.getElementById('materialSelect').value;
      var qty = parseFloat(document.getElementById('matQty').value);

      if (!matName) { alert('Material tanlang!'); return; }
      if (!qty || qty <= 0) { alert('Miqdorni kiriting!'); return; }

      // Materialni topish
      var mat = findMaterial(matName);
      if (!mat) { alert('Material topilmadi!'); return; }

      // Asosiy material (bir xil bo'lsa soni qo'shiladi)
      addOrMergeMaterial(mat.name, mat.unit, qty, mat.price, true);

      // Linked items
      showLoading('Material qo\'shilmoqda...');
      gasGet('getLinkedItems', { name: matName })
        .then(function(linked) {
          hideLoading();
          for (var i = 0; i < linked.materials.length; i++) {
            var childName = linked.materials[i].name;
            var childQty = linked.materials[i].qty;
            if (typeof childQty === 'string' && childQty.toLowerCase() === 'metr') {
              childQty = qty;
            } else {
              childQty = Number(childQty) * qty;
            }
            var childMat = findMaterial(childName);
            if (childMat) {
              addOrMergeMaterial(childMat.name, childMat.unit, childQty, childMat.price, true);
            }
          }
          for (var j = 0; j < linked.services.length; j++) {
            var svcName = linked.services[j].name;
            var svcQty = linked.services[j].qtyMultiplier;
            if (typeof svcQty === 'string' && svcQty.toLowerCase() === 'metr') {
              svcQty = qty;
            } else {
              svcQty = Number(svcQty) * qty;
            }
            var svc = findService(svcName);
            if (svc) {
              addOrMergeService(svc.name, svc.family || '', svc.unit, svcQty, svc.price);
            }
          }
          renderAll();
          showStatus(mat.name + ' qo\'shildi!', 'success');
          document.getElementById('materialSelect').value = '';

      if (!svcName) { alert('Xizmat tanlang!'); return; }
      if (!qty || qty <= 0) { alert('Miqdorni kiriting!'); return; }

      var svc = findService(svcName);
      if (!svc) { alert('Xizmat topilmadi!'); return; }

      addOrMergeService(svc.name, svc.family || '', svc.unit, qty, svc.price);

      renderAll();
      showStatus(svc.name + ' qo\'shildi!', 'success');
      document.getElementById('serviceSelect').value = '';

    function findMaterial(name) {
      var keys = Object.keys(appData.families);
      for (var k = 0; k < keys.length; k++) {
        var fam = appData.families[keys[k]];
        for (var i = 0; i < fam.length; i++) {
          if (fam[i].name === name) return fam[i];
        }
      }
      return null;

      for (var i = 0; i < appData.services.length; i++) {

      }
      return null;
    }

    function renderSummary() {
      // Split services into regular and tarmoq
      var regularSvcs = [];
      var tarmoqSvcs = [];
      for (var j = 0; j < appData.svcItems.length; j++) {
        var sv = appData.svcItems[j];
        if (sv.family === 'Tarmoqqa ulash') tarmoqSvcs.push(sv);
        else regularSvcs.push(sv);
      }

      // Calculate sums
      var jamiMat = 0, jamiMatFinal = 0;
      var jamiSvc = 0, jamiSvcFinal = 0;
      var jamiTarmoq = 0, jamiTarmoqFinal = 0;

      for (var i = 0; i < appData.materials.length; i++) {
        var m = appData.materials[i];
        var ms = m.qty * m.price;
        jamiMat += ms;
        if (m.active) jamiMatFinal += ms;
      }

      for (var j = 0; j < regularSvcs.length; j++) {
        var ss = regularSvcs[j].qty * regularSvcs[j].price;
        jamiSvc += ss;
        if (regularSvcs[j].active !== false) jamiSvcFinal += ss;
      }

      for (var j = 0; j < tarmoqSvcs.length; j++) {
        var ts = tarmoqSvcs[j].qty * tarmoqSvcs[j].price;
        jamiTarmoq += ts;
        if (tarmoqSvcs[j].active !== false) jamiTarmoqFinal += ts;
      }

      var kp = appData.settings.korxonaPercent || 18.71;
      var lp = appData.settings.loyihaPercent || 5;
      var qp = appData.settings.qqsPercent || 12;

      // New formulas
      var korxona = jamiSvcFinal > 0 ? jamiSvcFinal * (kp / 100) : 0;
      var loyiha = jamiMat * (lp / 100);
      var jami = jamiMatFinal + jamiSvcFinal + jamiTarmoqFinal + korxona + loyiha;
      var qqs = jami * (qp / 100);
      var total = jami + qqs;

      // Pechat ko'rinishi
      var viloyat = document.getElementById('viloyat').value || '';
      var tuman = document.getElementById('tuman').value || '';
      var mfy = document.getElementById('mfy').value || '';
      var kocha = document.getElementById('kocha').value || '';
      var korxonaName = document.getElementById('korxona').value || '';
      var smetaNo = document.getElementById('smetaNo').value || '';

      var h = '';

      // Sarlavha
      var addr = [viloyat, tuman, mfy, kocha].filter(function(x) { return x; }).join(', ');
      if (addr && korxonaName) {
        h += '<div class="pd-title">' + escHtml(addr) + ' joylashgan "' + escHtml(korxonaName) + '" uchun sarf harajat smetasi</div>';
      } else {
        h += '<div class="pd-title">Sarf harajat smetasi</div>';

      h += '<div class="pd-no">' + (smetaNo ? '№' + escHtml(smetaNo) : '') + '</div>';

      // === TABLE START ===
      h += '<table class="smeta-table"><thead><tr>';
      h += '<th style="width:25px">№</th><th>Material/Xizmat turi</th><th style="width:40px">Ed.</th>';
      h += '<th style="width:35px">Soni</th><th style="width:65px">Narx</th>';
      h += '<th style="width:65px">Summa</th><th style="width:70px">Yakuniy summa</th>';
      h += '</tr></thead><tbody>';

      // === SECTION 1: MATERIALLAR (blue header) ===
      if (appData.materials.length > 0) {
        h += '<tr><td colspan="7" style="background:linear-gradient(135deg,#1565C0,#1976D2);color:white;font-weight:700;text-align:center;padding:6px;">Materiallar</td></tr>';
        for (var i = 0; i < appData.materials.length; i++) {
          var m = appData.materials[i];
          var ms = m.qty * m.price;
          var cls = m.active ? '' : ' class="inactive-row"';
          h += '<tr' + cls + '>';
          h += '<td>' + (i + 1) + '</td>';
          h += '<td class="al">' + escHtml(m.name) + '</td>';
          h += '<td>' + escHtml(m.unit) + '</td>';
          h += '<td>' + m.qty + '</td>';
          h += '<td class="ar">' + fmtNum(m.price) + '</td>';
          h += '<td class="ar">' + fmtNum(ms) + '</td>';
          h += '<td class="ar">' + (m.active ? fmtNum(ms) : '0') + '</td>';
          h += '</tr>';
        }
        h += '<tr class="tr-total">';
        h += '<td colspan="5" class="al"><b>Jami material:</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiMat) + '</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiMatFinal) + '</b></td>';
        h += '</tr>';
      }

      // === SECTION 2: XIZMATLAR (orange header) ===
      if (regularSvcs.length > 0) {
        h += '<tr><td colspan="7" style="background:linear-gradient(135deg,#E65100,#FF6D00);color:white;font-weight:700;text-align:center;padding:6px;">Xizmatlar</td></tr>';
        for (var j = 0; j < regularSvcs.length; j++) {
          var sv = regularSvcs[j];
          var ss = sv.qty * sv.price;
          var cls = sv.active !== false ? '' : ' class="inactive-row"';
          h += '<tr' + cls + '>';
          h += '<td>' + (j + 1) + '</td>';
          h += '<td class="al">' + escHtml(sv.name) + '</td>';
          h += '<td>' + escHtml(sv.unit) + '</td>';
          h += '<td>' + sv.qty + '</td>';
          h += '<td class="ar">' + fmtNum(sv.price) + '</td>';
          h += '<td class="ar">' + fmtNum(ss) + '</td>';
          h += '<td class="ar">' + (sv.active !== false ? fmtNum(ss) : '0') + '</td>';
          h += '</tr>';
        }
        h += '<tr class="tr-total">';
        h += '<td colspan="5" class="al"><b>Jami xizmat:</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiSvc) + '</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiSvcFinal) + '</b></td>';
        h += '</tr>';
      }

      // === SECTION 3: TARMOQQA ULASH (green header) ===
      if (tarmoqSvcs.length > 0) {
        h += '<tr><td colspan="7" style="background:linear-gradient(135deg,#2E7D32,#43A047);color:white;font-weight:700;text-align:center;padding:6px;">Tarmoqqa ulash</td></tr>';
        for (var j = 0; j < tarmoqSvcs.length; j++) {
          var sv = tarmoqSvcs[j];
          var ss = sv.qty * sv.price;
          var cls = sv.active !== false ? '' : ' class="inactive-row"';
          h += '<tr' + cls + '>';
          h += '<td>' + (j + 1) + '</td>';
          h += '<td class="al">' + escHtml(sv.name) + '</td>';
          h += '<td>' + escHtml(sv.unit) + '</td>';
          h += '<td>' + sv.qty + '</td>';
          h += '<td class="ar">' + fmtNum(sv.price) + '</td>';
          h += '<td class="ar">' + fmtNum(ss) + '</td>';
          h += '<td class="ar">' + (sv.active !== false ? fmtNum(ss) : '0') + '</td>';
          h += '</tr>';
        }
        h += '<tr class="tr-total">';
        h += '<td colspan="5" class="al"><b>Jami tarmoqqa ulash:</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiTarmoq) + '</b></td>';
        h += '<td class="ar"><b>' + fmtNum(jamiTarmoqFinal) + '</b></td>';
        h += '</tr>';
      }

      // === HISOB-KITOB ===
      h += '<tr><td colspan="6" class="al">Korxona harajatlari ' + kp + '%</td><td class="ar">' + fmtNum(korxona) + '</td></tr>';
      h += '<tr><td colspan="6" class="al">Loyiha xizmati ' + lp + '%</td><td class="ar">' + fmtNum(loyiha) + '</td></tr>';
      h += '<tr class="ct-jami"><td colspan="6" class="al"><b>Jami:</b></td><td class="ar"><b>' + fmtNum(jami) + '</b></td></tr>';
      h += '<tr><td colspan="6" class="al">QQS ' + qp + '%</td><td class="ar">' + fmtNum(qqs) + '</td></tr>';
      h += '<tr class="ct-total"><td colspan="6" class="al"><b>To\'lov uchun jami:</b></td><td class="ar"><b>' + fmtNum(total) + ' so\'m</b></td></tr>';
      h += '</tbody></table>';

      // Izoh
      var izoh = appData.settings.izohText || '';
      if (izoh) {
        h += '<div class="pd-izoh"><b>Izoh:</b> ' + escHtml(izoh) + '</div>';
      }

      document.getElementById('printPreview').innerHTML = h;
    }

    // ==================== SAVE ====================
    function saveSmeta() {
      var korxona = document.getElementById('korxona').value;
      if (!korxona) {
        alert('Korxona nomini kiriting!');
        goStep(1);
        return;
      }

      if (appData.materials.length === 0) {
        alert('Kamida bitta material qo\'shing!');
        goStep(2);
        return;
      }

      var smetaData = {
        telegramId: appData.telegramId || 0,
        viloyat: document.getElementById('viloyat').value,
        tuman: document.getElementById('tuman').value,
        mfy: document.getElementById('mfy').value,
        kocha: document.getElementById('kocha').value,
        korxona: korxona,
        smetaNo: document.getElementById('smetaNo').value,
        materials: appData.materials,
        services: appData.svcItems
      };

      showLoading('Saqlanmoqda...');

      gasPost('saveSmeta', { data: smetaData })
        .then(function(result) {
          if (result.error) { hideLoading(); showStatus(result.error, 'error'); return; }

          showLoading('PDF + Excel tayyorlanmoqda...');
          var exportDone = { pdf: false, excel: false, pdfOk: false, excelOk: false };

          function checkExportDone() {
            if (!exportDone.pdf || !exportDone.excel) return;
            hideLoading();
            var msg = 'Smeta saqlandi! ID: ' + result.smetaId;
            if (exportDone.pdfOk) msg += '\nPDF yuborildi!';
            if (exportDone.excelOk) msg += '\nExcel yuborildi!';
            showStatus(msg, 'success');
            appData.materials = []; appData.svcItems = [];
            document.getElementById('viloyat').value = '';
            document.getElementById('tuman').value = '';
            document.getElementById('mfy').value = '';
            document.getElementById('kocha').value = '';
            document.getElementById('korxona').value = '';
            document.getElementById('smetaNo').value = '';
            renderAll();
            goScreen('home');
          }

          gasPost('exportAndSend', { sheetName: result.sheetName, format: 'pdf', telegramId: appData.telegramId })
            .then(function(res) { exportDone.pdf = true; exportDone.pdfOk = res && res.success; checkExportDone(); })
            .catch(function() { exportDone.pdf = true; checkExportDone(); });

          gasPost('exportAndSend', { sheetName: result.sheetName, format: 'xlsx', telegramId: appData.telegramId })
            .then(function(res) { exportDone.excel = true; exportDone.excelOk = res && res.success; checkExportDone(); })
            .catch(function() { exportDone.excel = true; checkExportDone(); });
        })
        .catch(function(err) {
          hideLoading();
          showStatus('Xatolik: ' + err.message, 'error');
        });
    }

    // ==================== HELPERS ====================
    function fmtNum(n) {
      return Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function escHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showLoading(msg) {
      document.getElementById('loadingText').textContent = msg || 'Yuklanmoqda...';
      var overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('active');
      // Force reflow to ensure overlay renders before continuing
      overlay.offsetHeight;
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    function showStatus(msg, type) {
      var el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
      setTimeout(function() { el.className = 'status-msg'; }, 4000);
    }

    // ==================== ADMIN PANEL ====================
    var admData = { materials: [], services: [], links: [], users: [], editRow: null, editType: null };

    function admCall(action, params, cb, loadMsg) {
      if (loadMsg) showLoading(loadMsg);
      gasPost('admin', { telegramId: appData.telegramId, subAction: action, params: params || {} })
        .then(function(r) {
          if (loadMsg) hideLoading();
          if (r && r.error) {
            showStatus(r.error, 'error');
            if (cb) cb(null);
            return;
          }
          if (cb) cb(r);
        })
        .catch(function(e) {
          if (loadMsg) hideLoading();
          showStatus('Xatolik: ' + e.message, 'error');
          if (cb) cb(null);
        });
    }

        }, 'Saqlanmoqda...');
      } else {
        admCall('addService', { name: n, family: f, unit: u, price: p }, function() {
          showStatus('Qo\'shildi!', 'success'); asReset(); loadAdmServices(); loadData();
        }, 'Qo\'shilmoqda...');
      }
    }

    function asEdit(i) {
      var s = admData.services[i];
      admData.editRow = s.row; admData.editType = 'svc';
      document.getElementById('as_name').value = s.name;
      document.getElementById('as_family').value = s.family || '';
      document.getElementById('as_unit').value = s.unit || '';
      document.getElementById('as_price').value = s.price || 0;
      document.getElementById('asBtn').textContent = 'Yangilash';
      document.getElementById('as_name').focus();
    }

    function asDel(i) {
      if (!confirm('O\'chirilsinmi?')) return;
      admCall('deleteService', { row: admData.services[i].row }, function() {
        showStatus('O\'chirildi!', 'success'); loadAdmServices(); loadData();
      }, 'O\'chirilmoqda...');
    }

    function asReset() {
      admData.editRow = null; admData.editType = null;
      document.getElementById('as_name').value = '';
      document.getElementById('as_family').value = '';
      document.getElementById('as_unit').value = '';
      document.getElementById('as_price').value = '';
      document.getElementById('asBtn').textContent = 'Qo\'shish';
    }

    // --- Bog'lanishlar ---
    function loadAdmLinks() {
      admCall('getLinks', {}, function(list) {
        admData.links = list || [];
        renderAdmLinks();
        populateAlParent();
      }, 'Bog\'lanishlar yuklanmoqda...');
    }

    function populateAlParent() {
      var sel = document.getElementById('al_parent');
      sel.innerHTML = '<option value="">-- Material tanlang --</option>';
      var keys = Object.keys(appData.families).sort();
      for (var k = 0; k < keys.length; k++) {
        var grp = document.createElement('optgroup');
        grp.label = keys[k];
        var fam = appData.families[keys[k]];
        for (var i = 0; i < fam.length; i++) {
          var opt = document.createElement('option');
          opt.value = fam[i].name;
          opt.textContent = fam[i].name;
          grp.appendChild(opt);
        }
        sel.appendChild(grp);
      }
    }

    function renderAdmLinks() {
      var el = document.getElementById('alList');
      var list = admData.links;
      if (!list.length) { el.innerHTML = '<div class="empty-msg">Bog\'lanish topilmadi</div>'; return; }
      var h = '';
      for (var i = 0; i < list.length; i++) {
        var l = list[i];
        h += '<div class="adm-item adm-link-item">';
        h += '<div class="adm-link-top"><div class="ai-name">' + escHtml(l.parent) + '</div>';
        h += '<div class="ai-acts"><button class="ai-edit" onclick="alEdit(' + i + ')">✎</button>';
        h += '<button class="ai-del" onclick="alDel(' + i + ')">✕</button></div></div>';
        if (l.children.length || l.services.length) {
          h += '<div class="adm-link-children">';
          for (var c = 0; c < l.children.length; c++) {
            h += '📦 ' + escHtml(l.children[c].name) + ' (' + l.children[c].qty + ')<br>';
          }
          for (var s = 0; s < l.services.length; s++) {
            h += '🔧 ' + escHtml(l.services[s].name) + ' (' + l.services[s].qty + ')<br>';
          }
          h += '</div>';
        }
        h += '</div>';
      }
      el.innerHTML = h;
    }

    function alAddChild(name, qty) {
      var c = document.getElementById('al_children');
      var div = document.createElement('div');
      div.className = 'al-row';
      var sel = document.createElement('select');
      sel.innerHTML = '<option value="">-- Material --</option>';
      var keys = Object.keys(appData.families).sort();
      for (var k = 0; k < keys.length; k++) {
        var fam = appData.families[keys[k]];
        for (var i = 0; i < fam.length; i++) {
          var opt = document.createElement('option');
          opt.value = fam[i].name;
          opt.textContent = fam[i].name;
          if (name && fam[i].name === name) opt.selected = true;
          sel.appendChild(opt);
        }
      }
      var inp = document.createElement('input');
      inp.type = 'number'; inp.value = qty || 1; inp.min = '0.1'; inp.step = '0.1';
      var btn = document.createElement('button');
      btn.className = 'al-row-rm'; btn.textContent = '\u2715';
      btn.onclick = function() { div.remove(); };
      div.appendChild(sel); div.appendChild(inp); div.appendChild(btn);
      c.appendChild(div);
    }

    function alAddSvc(name, qty) {
      var c = document.getElementById('al_svcs');
      var div = document.createElement('div');
      div.className = 'al-row';
      var sel = document.createElement('select');
      sel.innerHTML = '<option value="">-- Xizmat --</option>';
      for (var i = 0; i < appData.services.length; i++) {
        var s = appData.services[i];
        var opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        if (name && s.name === name) opt.selected = true;
        sel.appendChild(opt);
      }
      var inp = document.createElement('input');
      inp.type = 'number'; inp.value = qty || 1; inp.min = '0.1'; inp.step = '0.1';
      var btn = document.createElement('button');
      btn.className = 'al-row-rm'; btn.textContent = '\u2715';
      btn.onclick = function() { div.remove(); };
      div.appendChild(sel); div.appendChild(inp); div.appendChild(btn);
      c.appendChild(div);
    }

    function alEdit(i) {
      var l = admData.links[i];
      document.getElementById('al_parent').value = l.parent;
      document.getElementById('al_children').innerHTML = '';
      document.getElementById('al_svcs').innerHTML = '';
      for (var c = 0; c < l.children.length; c++) alAddChild(l.children[c].name, l.children[c].qty);
      for (var s = 0; s < l.services.length; s++) alAddSvc(l.services[s].name, l.services[s].qty);
      document.getElementById('al_parent').scrollIntoView({ behavior: 'smooth' });
    }

    function alSave() {
      var parent = document.getElementById('al_parent').value;
      if (!parent) { alert('Material tanlang!'); return; }
      var children = [];
      var childRows = document.querySelectorAll('#al_children .al-row');
      for (var i = 0; i < childRows.length; i++) {
        var s = childRows[i].querySelector('select');
        var inp = childRows[i].querySelector('input');
        if (s.value) children.push({ name: s.value, qty: parseFloat(inp.value) || 1 });
      }
      var services = [];
      var svcRows = document.querySelectorAll('#al_svcs .al-row');
      for (var j = 0; j < svcRows.length; j++) {
        var s2 = svcRows[j].querySelector('select');
        var inp2 = svcRows[j].querySelector('input');
        if (s2.value) services.push({ name: s2.value, qty: parseFloat(inp2.value) || 1 });
      }
      admCall('saveLink', { parentName: parent, children: children, services: services }, function() {
        showStatus('Saqlandi!', 'success'); alResetForm(); loadAdmLinks();
      }, 'Saqlanmoqda...');
    }

    function alDel(i) {
      if (!confirm('O\'chirilsinmi?')) return;
      admCall('deleteLink', { row: admData.links[i].row }, function() {
        showStatus('O\'chirildi!', 'success'); loadAdmLinks();
      }, 'O\'chirilmoqda...');
    }

    function alResetForm() {
      document.getElementById('al_parent').value = '';
      document.getElementById('al_children').innerHTML = '';
      document.getElementById('al_svcs').innerHTML = '';
    }

    // --- Foydalanuvchilar ---
    function loadAdmUsers() {
      showLoading('Foydalanuvchilar yuklanmoqda...');
      gasGet('getUsersDirect', { tgid: appData.telegramId || 0 })
        .then(function(list) {
          hideLoading();
          admData.users = (list && Array.isArray(list)) ? list : [];
          renderAdmUsers();
        })
        .catch(function(e) {
          hideLoading();
          document.getElementById('auList').innerHTML = '<div class="empty-msg">Xatolik: ' + e.message + '</div>';
        });
    }

    function renderAdmUsers() {
      var el = document.getElementById('auList');
      var list = admData.users;
      if (!list.length) { el.innerHTML = '<div class="empty-msg">Foydalanuvchi topilmadi</div>'; return; }
      var h = '';
      for (var i = 0; i < list.length; i++) {
        var u = list[i];
        var badge = u.role === 'admin' ? ' \uD83D\uDD11' : '';
        h += '<div class="adm-item"><div><div class="ai-name">' + escHtml(u.name) + badge + '</div>';
        h += '<div class="ai-info">' + (u.role || '') + ' | TG:' + (u.telegramId || '-') + ' | ' + (u.email || '-') + '</div></div>';
        h += '<div class="ai-acts"><button class="ai-edit" onclick="auEdit(' + i + ')">✎</button>';
        h += '<button class="ai-del" onclick="auDel(' + i + ')">✕</button></div></div>';
      }
      el.innerHTML = h;
    }

    function auSave() {
      var n = document.getElementById('au_name').value.trim();
      var r = document.getElementById('au_role').value;
      var e = document.getElementById('au_email').value.trim();
      var t = document.getElementById('au_tgid').value.trim();
      if (!n) { alert('Ism kiriting!'); return; }
      if (admData.editRow && admData.editType === 'user') {
        admCall('updateUser', { row: admData.editRow, name: n, role: r, email: e, telegramId: t }, function() {
          showStatus('Yangilandi!', 'success'); auReset(); loadAdmUsers();
        }, 'Saqlanmoqda...');
      } else {
        admCall('addUser', { name: n, role: r, email: e, telegramId: t }, function() {
          showStatus('Qo\'shildi!', 'success'); auReset(); loadAdmUsers();
        }, 'Qo\'shilmoqda...');
      }
    }

    function auEdit(i) {
      var u = admData.users[i];
      admData.editRow = u.row; admData.editType = 'user';
      document.getElementById('au_name').value = u.name;
      document.getElementById('au_role').value = u.role || 'smetchik';
      document.getElementById('au_email').value = u.email || '';
      document.getElementById('au_tgid').value = u.telegramId || '';
      document.getElementById('auBtn').textContent = 'Yangilash';
      document.getElementById('au_name').focus();
    }

    function auDel(i) {
      if (!confirm('O\'chirilsinmi?')) return;
      admCall('deleteUser', { row: admData.users[i].row }, function() {
        showStatus('O\'chirildi!', 'success'); loadAdmUsers();
      }, 'O\'chirilmoqda...');
    }

    function auReset() {
      admData.editRow = null; admData.editType = null;
      document.getElementById('au_name').value = '';
      document.getElementById('au_role').value = 'smetchik';
      document.getElementById('au_email').value = '';
      document.getElementById('au_tgid').value = '';
      document.getElementById('auBtn').textContent = 'Qo\'shish';
    }

    // --- Sozlamalar ---
    function loadAdmSettings() {
      admCall('getSettings', {}, function(s) {
        document.getElementById('az_loyiha').value = s.loyihaPercent || 5;
        document.getElementById('az_qqs').value = s.qqsPercent || 12;
        document.getElementById('az_korxona').value = s.korxonaPercent || 18.71;
        document.getElementById('az_izoh').value = s.izohText || '';
      }, 'Sozlamalar yuklanmoqda...');
    }

    function azSave() {
      var l = parseFloat(document.getElementById('az_loyiha').value) || 0;
      var q = parseFloat(document.getElementById('az_qqs').value) || 0;
      var k = parseFloat(document.getElementById('az_korxona').value) || 0;
      var iz = document.getElementById('az_izoh').value;
      admCall('saveSettings', { loyiha: l, qqs: q, korxona: k, izoh: iz }, function() {
        showStatus('Sozlamalar saqlandi!', 'success');
        loadData();
      }, 'Saqlanmoqda...');
    }

    function resetWebhook() {
      admCall('resetWebhook', {}, function(r) {
        if (r && r.success) {
          showStatus('Webhook qayta o\'rnatildi!', 'success');
        } else {
          showStatus('Xatolik: ' + JSON.stringify(r), 'error');
        }
      }, 'Webhook o\'rnatilmoqda...');
    }
  </script>
</body>
</html>
